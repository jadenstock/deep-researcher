[project]
name = "deep-research-agent"
version = "0.0.1"
description = "Evidence-grounded deep research agent: four-phase pipeline with mutable task graph, role-to-model routing, and Analytic Pyramid reporting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-ai>=0.1",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "markitdown[pdf]>=0.1.5",
    "pypdf>=4.0",
    "arxiv>=2.1",
    "diskcache>=5.6",
    "rich>=13.9",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "logfire>=4.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
dra = "deep_research_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
