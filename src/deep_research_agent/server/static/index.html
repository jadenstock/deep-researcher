<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>deep-research-agent — live</title>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/webcola@3.4.0/WebCola/cola.min.js"></script>
<script src="https://unpkg.com/cytoscape-cola@2.5.1/cytoscape-cola.js"></script>
<script src="https://unpkg.com/marked@14.1.2/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f2330;
    --border: #2a2f3c;
    --text: #e3e7ef;
    --muted: #8892a6;
    --accent: #6aa9ff;
    --ok: #6bd88f;
    --warn: #ffbb55;
    --err: #ff6b6b;
    --landscape: #a87bff;
    --question: #ffbb55;
    --source: #6aa9ff;
    --synthesis: #6bd88f;
    --decision: #e3e7ef;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    color: var(--text); background: var(--bg);
  }
  body {
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: minmax(0, 1fr);
    height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel); display: flex; gap: 12px; align-items: center;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; color: var(--muted); letter-spacing: 0.04em; }
  header h1 span { color: var(--accent); }
  #query {
    flex: 1;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: 6px; font-size: 13px;
  }
  #query:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  button {
    background: var(--accent); color: #0b0d12; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.05); }
  button:disabled { opacity: 0.5; cursor: default; }
  #runs-select {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 7px 10px; border-radius: 6px; font-size: 12px; max-width: 260px;
  }
  #runs-select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

  /* Top-level view tabs: Live (graph + sidebars) vs Report (full-page markdown). */
  .tabs {
    display: flex; gap: 2px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px;
  }
  .tab {
    background: transparent; color: var(--muted);
    border: none; border-radius: 4px;
    padding: 6px 12px; font-size: 12px; font-weight: 600;
    cursor: pointer; letter-spacing: 0.02em;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--panel); color: var(--text); }
  .tab.has-report { color: var(--ok); }
  .tab.flash { animation: flash 1.2s ease-out 1; }
  @keyframes flash {
    0%   { box-shadow: 0 0 0 0 var(--ok); }
    50%  { box-shadow: 0 0 0 8px rgba(107, 216, 143, 0.4); }
    100% { box-shadow: 0 0 0 0 var(--ok); }
  }
  #status { color: var(--muted); font-size: 12px; min-width: 80px; text-align: right; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  #debug {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px; color: var(--muted);
    padding: 4px 8px; background: var(--panel-2);
    border-radius: 4px; border: 1px solid var(--border);
  }
  #debug.err { color: var(--err); }
  #tokens {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px; color: var(--muted);
    padding: 4px 8px; background: var(--panel-2);
    border-radius: 4px; border: 1px solid var(--border);
    cursor: help;
  }
  #tokens .label { color: var(--muted); }
  #tokens .n { color: var(--fg); font-weight: 600; }

  main {
    display: flex;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
  }
  #graph { flex: 1 1 auto; background: var(--bg); min-width: 0; overflow: hidden; }
  aside {
    display: flex;
    flex-direction: column;
    width: 360px;
    min-width: 200px;
    flex: 0 0 auto;
    min-height: 0;
  }
  /* Left aside is the live "Running Agents" panel. Same aside shape as
     the right sidebar but narrower by default and with its own width /
     resize constraints. */
  aside#left-aside {
    width: 280px;
    min-width: 220px;
    border-right: 1px solid var(--border);
  }
  section { display: flex; flex-direction: column; min-height: 0; flex: 1 1 0; }
  section h2 {
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); margin: 0; padding: 10px 12px;
    border-bottom: 1px solid var(--border); background: var(--panel);
    user-select: none;
  }
  /* Resizers — thin draggable gutters between panes. */
  .resizer-v {
    flex: 0 0 4px;
    cursor: col-resize;
    background: var(--border);
    transition: background 0.1s;
  }
  .resizer-h {
    flex: 0 0 4px;
    cursor: row-resize;
    background: var(--border);
    transition: background 0.1s;
  }
  .resizer-v:hover, .resizer-h:hover, .resizer-v.dragging, .resizer-h.dragging {
    background: var(--accent);
  }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing-row { cursor: row-resize; user-select: none; }

  /* Running agents — live cards, one per dispatched task, removed on done. */
  #running-agents { overflow-y: auto; padding: 6px 8px; font-size: 12px; }
  #running-agents .empty {
    padding: 16px 8px;
    color: var(--muted); font-style: italic; text-align: center;
  }
  .agent-card {
    position: relative;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--muted);
    border-radius: 4px;
    padding: 8px 10px 8px 12px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.2s;
  }
  .agent-card:hover { border-color: var(--accent); }
  .agent-card.tier-LOW    { border-left-color: var(--muted); }
  .agent-card.tier-MID    { border-left-color: var(--accent); }
  .agent-card.tier-HIGH   { border-left-color: var(--landscape); }
  .agent-card.done     { border-left-color: var(--ok); }
  .agent-card.abandoned { border-left-color: var(--err); }
  .agent-card.fading {
    opacity: 0;
    transform: translateX(-8px);
    pointer-events: none;
  }
  .agent-card .head {
    display: flex; align-items: center; gap: 6px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10.5px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .agent-card .head .type {
    color: var(--accent); font-weight: 600;
  }
  .agent-card .head .sep { opacity: 0.5; }
  .agent-card .head .tier-pill {
    font-size: 9px; letter-spacing: 0.06em;
    padding: 1px 5px; border-radius: 2px;
    background: rgba(255,255,255,0.06);
  }
  .agent-card .head .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--warn); animation: pulse 1.2s infinite;
  }
  .agent-card.done .head .dot { background: var(--ok); animation: none; }
  .agent-card.abandoned .head .dot { background: var(--err); animation: none; }
  .agent-card .goal {
    font-size: 12px; color: var(--text);
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    margin-bottom: 4px;
  }
  .agent-card .foot {
    display: flex; justify-content: space-between;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px; color: var(--muted);
  }
  .agent-card .foot .io { color: var(--muted); }
  .agent-card .foot .io b { color: var(--text); font-weight: 500; }
  .agent-card .foot .elapsed { font-variant-numeric: tabular-nums; }
  .agent-card .tool-activity {
    margin-top: 6px;
    border-top: 1px dashed rgba(255,255,255,0.08);
    padding-top: 6px;
    display: flex;
    flex-direction: column-reverse; /* newest on top */
    gap: 2px;
    max-height: 90px;
    overflow-y: auto;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px;
    line-height: 1.35;
  }
  .agent-card .tool-activity:empty { display: none; }
  .agent-card .tool-row {
    display: grid;
    grid-template-columns: 6px auto 1fr auto;
    gap: 6px;
    align-items: baseline;
    color: var(--muted);
  }
  .agent-card .tool-row .dot-tc {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--warn); align-self: center;
    animation: pulse 1s infinite;
  }
  .agent-card .tool-row.ok .dot-tc { background: var(--ok); animation: none; }
  .agent-card .tool-row.error .dot-tc { background: var(--err); animation: none; }
  .agent-card .tool-row .tc-name {
    color: var(--accent); font-weight: 500;
  }
  .agent-card .tool-row .tc-summary {
    color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .agent-card .tool-row .tc-ms {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .agent-card .expanded-body {
    display: none;
    margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed rgba(255,255,255,0.08);
    font-size: 11px; line-height: 1.4;
  }
  .agent-card.expanded .expanded-body { display: block; }
  .agent-card.expanded .goal {
    -webkit-line-clamp: unset;
    display: block;
  }
  .agent-card .expanded-body .label {
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em;
    font-size: 9px; margin: 4px 0 2px;
  }
  .agent-card .expanded-body .note-link {
    color: var(--accent); cursor: pointer; padding: 2px 0;
    font-family: ui-monospace, Menlo, monospace; font-size: 10.5px;
  }
  .agent-card .expanded-body .note-link:hover { text-decoration: underline; }
  .agent-card .expanded-body .kv {
    color: var(--text); font-family: ui-monospace, Menlo, monospace;
    font-size: 10.5px;
  }
  .agent-card .expanded-body .kv .k { color: var(--muted); margin-right: 6px; }

  /* Task list */
  #tasks { overflow-y: auto; padding: 4px 0; font-size: 12px; }
  .task-row {
    display: grid;
    grid-template-columns: 14px 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    border-bottom: 1px dashed rgba(255,255,255,0.04);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .task-row .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
  }
  .task-row.running .dot { background: var(--warn); animation: pulse 1.2s infinite; }
  .task-row.done    .dot { background: var(--ok); }
  .task-row.abandoned .dot { background: var(--err); }
  .task-row .main { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-row .type { color: var(--accent); font-weight: 600; margin-right: 6px; }
  .task-row .goal { color: var(--muted); }
  .task-row .verdict {
    color: var(--muted); font-size: 11px; max-width: 140px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }
  #activity {
    overflow-y: auto; padding: 8px 12px; font-size: 12px; line-height: 1.45;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .log-row { padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,0.04); }
  .log-row .t { color: var(--muted); margin-right: 6px; }
  .log-row .tag { display: inline-block; min-width: 16px; text-align: center; margin-right: 6px; }
  .log-row.task-started .tag { color: var(--warn); }
  .log-row.task-done    .tag { color: var(--ok); }
  .log-row.note-created .tag { color: var(--accent); }
  .log-row.note-replaced .tag { color: var(--landscape); }
  .log-row.run-done .tag { color: var(--ok); }
  .log-row.run-failed .tag { color: var(--err); }
  .log-row.run-failed { color: var(--err); }

  /* Full-page report view — shown when the "Report" tab is active. */
  #report-view { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #live-view[hidden], #report-view[hidden] { display: none !important; }
  #report-view {
    overflow-y: auto;
    background: var(--bg);
    padding: 40px 24px 80px;
  }
  #report-view .report-container {
    max-width: 860px;
    margin: 0 auto;
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.7;
  }
  #report-view .report-empty {
    color: var(--muted); font-style: italic; text-align: center; padding: 80px 0;
  }
  #report-view .report-head {
    padding-bottom: 16px; margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  #report-view .report-head h1 {
    font-size: 28px; font-weight: 700; margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  #report-view .report-head .sub {
    color: var(--muted); font-size: 12px;
    font-family: ui-monospace, Menlo, monospace;
  }
  #report-view .report-body h1 { font-size: 26px; margin: 32px 0 12px; }
  #report-view .report-body h2 { font-size: 21px; margin: 28px 0 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  #report-view .report-body h3 { font-size: 17px; margin: 22px 0 8px; color: var(--accent); }
  #report-view .report-body h4 { font-size: 15px; margin: 18px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  #report-view .report-body p { margin: 0 0 14px; }
  #report-view .report-body ul,
  #report-view .report-body ol { margin: 0 0 14px; padding-left: 28px; }
  #report-view .report-body li { margin: 4px 0; }
  #report-view .report-body li > ul,
  #report-view .report-body li > ol { margin: 4px 0; }
  #report-view .report-body blockquote {
    margin: 14px 0; padding: 8px 16px;
    border-left: 3px solid var(--accent);
    background: var(--panel-2); color: var(--muted);
    border-radius: 0 4px 4px 0;
  }
  #report-view .report-body code {
    background: var(--panel-2); padding: 1px 6px;
    border-radius: 3px; font-size: 14px;
    font-family: ui-monospace, Menlo, monospace;
  }
  #report-view .report-body pre {
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 12px 14px; border-radius: 6px; overflow-x: auto;
    font-size: 13px; line-height: 1.5;
  }
  #report-view .report-body pre code {
    background: transparent; padding: 0;
  }
  #report-view .report-body a { color: var(--accent); text-decoration: none; }
  #report-view .report-body a:hover { text-decoration: underline; }
  #report-view .report-body table {
    border-collapse: collapse; margin: 14px 0; width: 100%;
    font-size: 14px;
  }
  #report-view .report-body th,
  #report-view .report-body td {
    border: 1px solid var(--border);
    padding: 8px 12px; text-align: left;
  }
  #report-view .report-body th { background: var(--panel-2); font-weight: 600; }
  #report-view .report-body hr {
    border: none; border-top: 1px solid var(--border); margin: 24px 0;
  }
  #report-view .report-meta {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 8px 12px;
    font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    color: var(--muted); white-space: pre-wrap;
    margin-bottom: 24px;
  }
  #report-view .report-meta summary {
    cursor: pointer; color: var(--muted);
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  }
  #report-view .report-meta[open] summary { margin-bottom: 8px; }

  #details { overflow-y: auto; padding: 12px; font-size: 13px; line-height: 1.55; }
  #details h3 { margin: 0 0 4px; font-size: 14px; }
  #details .subtitle { color: var(--muted); font-size: 11px; margin-bottom: 12px; }
  #details .meta {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px;
    padding: 6px 8px; font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    color: var(--muted); margin-bottom: 12px; white-space: pre-wrap;
  }
  #details .body { color: var(--text); }
  #details .body p { margin: 0 0 10px; }
  #details .body code {
    background: var(--panel-2); padding: 1px 4px; border-radius: 3px; font-size: 12px;
  }
  #details .placeholder { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>dra <span>·</span> live</h1>
  <input id="query" placeholder="Ask a research question…" autocomplete="off" />
  <button id="go">Run</button>
  <select id="runs-select" title="Reconnect to a past run from this server session">
    <option value="">past runs…</option>
  </select>
  <div class="tabs" role="tablist">
    <button class="tab active" id="tab-live" data-view="live" role="tab">Live</button>
    <button class="tab" id="tab-report" data-view="report" role="tab" hidden>Report</button>
  </div>
  <div id="debug" title="events received · nodes in graph · layout engine">evt=0 · nodes=0 · layout=?</div>
  <div id="tokens" title="Total tokens used by this run (hover for per-model breakdown)"><span class="label">tokens:</span> <span class="n" id="tokens-in">0</span> in / <span class="n" id="tokens-out">0</span> out</div>
  <div id="status">idle</div>
</header>
<main id="live-view">
  <aside id="left-aside">
    <section id="sec-running-agents">
      <h2><span id="running-agents-title">Agents Running</span></h2>
      <div id="running-agents">
        <div class="empty">No agents running.</div>
      </div>
    </section>
  </aside>
  <div class="resizer-v" data-resize="cols" data-side="left"></div>
  <div id="graph"></div>
  <div class="resizer-v" data-resize="cols" data-side="right"></div>
  <aside id="right-aside">
    <section id="sec-tasks">
      <h2>Tasks</h2>
      <div id="tasks"><div class="placeholder" style="padding:12px;color:var(--muted);font-style:italic;">No tasks yet.</div></div>
    </section>
    <div class="resizer-h" data-resize="rows" data-top="#sec-tasks" data-bottom="#sec-activity"></div>
    <section id="sec-activity">
      <h2>Activity</h2>
      <div id="activity"></div>
    </section>
    <div class="resizer-h" data-resize="rows" data-top="#sec-activity" data-bottom="#sec-details"></div>
    <section id="sec-details">
      <h2>Note details</h2>
      <div id="details"><div class="placeholder">Click a node to view its note.</div></div>
    </section>
  </aside>
</main>
<section id="report-view" hidden>
  <div class="report-container">
    <div id="report-content"><div class="report-empty">No report yet — start a run.</div></div>
  </div>
</section>
<script>
(() => {
  const queryInput = document.getElementById("query");
  const goBtn = document.getElementById("go");
  const statusEl = document.getElementById("status");
  const activityEl = document.getElementById("activity");
  const detailsEl = document.getElementById("details");
  const tasksEl = document.getElementById("tasks");
  const debugEl = document.getElementById("debug");
  const liveView = document.getElementById("live-view");
  const reportView = document.getElementById("report-view");
  const reportContent = document.getElementById("report-content");
  const tabLive = document.getElementById("tab-live");
  const tabReport = document.getElementById("tab-report");
  const tokensEl = document.getElementById("tokens");
  const tokensInEl = document.getElementById("tokens-in");
  const tokensOutEl = document.getElementById("tokens-out");
  let lastReportNoteId = null;
  let eventCount = 0;

  // Running token totals for the current run. Keys: "in", "out",
  // "cacheRead", "cacheWrite". Per-model map keyed by model_id holds
  // the same shape — surfaced in the tooltip on hover.
  const tokenTotals = { in: 0, out: 0, cacheRead: 0, cacheWrite: 0 };
  const tokenByModel = new Map();

  function fmtNum(n) {
    if (n < 1000) return String(n);
    if (n < 1_000_000) return (n / 1000).toFixed(n < 10_000 ? 1 : 0) + "k";
    return (n / 1_000_000).toFixed(2) + "M";
  }

  function resetTokens() {
    tokenTotals.in = tokenTotals.out = tokenTotals.cacheRead = tokenTotals.cacheWrite = 0;
    tokenByModel.clear();
    renderTokens();
  }

  function renderTokens() {
    tokensInEl.textContent = fmtNum(tokenTotals.in);
    tokensOutEl.textContent = fmtNum(tokenTotals.out);
    // Per-model breakdown lands in the title tooltip. Short lines,
    // one per model, so hovering gives a quick audit without needing
    // a dedicated panel.
    const lines = ["tokens: " + tokenTotals.in.toLocaleString() + " in / " + tokenTotals.out.toLocaleString() + " out"];
    if (tokenTotals.cacheRead || tokenTotals.cacheWrite) {
      lines.push("  cache: " + tokenTotals.cacheRead.toLocaleString() + " read / " + tokenTotals.cacheWrite.toLocaleString() + " write");
    }
    if (tokenByModel.size) {
      lines.push("");
      for (const [model, m] of tokenByModel) {
        lines.push(`${model}: ${m.in.toLocaleString()} in / ${m.out.toLocaleString()} out`);
      }
    }
    tokensEl.title = lines.join("\n");
  }

  function onTokenUsage(data) {
    const inT = data.input_tokens || 0;
    const outT = data.output_tokens || 0;
    const cacheR = data.cache_read_tokens || 0;
    const cacheW = data.cache_write_tokens || 0;
    tokenTotals.in += inT;
    tokenTotals.out += outT;
    tokenTotals.cacheRead += cacheR;
    tokenTotals.cacheWrite += cacheW;
    const mid = data.model_id || "?";
    const m = tokenByModel.get(mid) || { in: 0, out: 0, cacheRead: 0, cacheWrite: 0 };
    m.in += inT;
    m.out += outT;
    m.cacheRead += cacheR;
    m.cacheWrite += cacheW;
    tokenByModel.set(mid, m);
    renderTokens();
  }
  function updateDebug(extra) {
    const nodeCount = cy ? cy.nodes().length : 0;
    const engine = colaAvailable ? "cola" : "cose";
    debugEl.textContent = `evt=${eventCount} · nodes=${nodeCount} · layout=${engine}${extra ? " · " + extra : ""}`;
  }

  function switchView(view) {
    const showLive = view === "live";
    liveView.hidden = !showLive;
    reportView.hidden = showLive;
    tabLive.classList.toggle("active", showLive);
    tabReport.classList.toggle("active", !showLive);
    // Cytoscape needs a resize + relayout kick when the graph container
    // transitions from hidden to visible — it caches container dims.
    if (showLive) {
      setTimeout(() => { try { cy.resize(); cy.fit(undefined, 40); } catch {} }, 0);
    }
  }
  tabLive.addEventListener("click", () => switchView("live"));
  tabReport.addEventListener("click", () => switchView("report"));

  // Verification decision_notes (subtype "verification") get their own
  // visual treatment so checked claims stand out from AIMS / final-report
  // decision notes in the graph.
  function nodeKey(d) {
    if (d.type === "decision_note" && d.subtype === "verification") return "verification";
    return d.type;
  }
  const NODE_COLORS = {
    landscape_note: "#a87bff",
    question_note: "#ffbb55",
    source_note: "#6aa9ff",
    synthesis_note: "#6bd88f",
    decision_note: "#e3e7ef",
    open_question_note: "#ff6b6b",
    hypothesis_note: "#ffaf80",
    verification: "#f0a5ff",
  };
  const NODE_SHAPES = {
    landscape_note: "hexagon",
    question_note: "round-triangle",
    source_note: "ellipse",
    synthesis_note: "round-diamond",
    decision_note: "round-rectangle",
    open_question_note: "star",
    hypothesis_note: "pentagon",
    verification: "round-octagon",
  };
  const NODE_GLYPHS = {
    landscape_note: "L",
    question_note: "?",
    source_note: "S",
    synthesis_note: "Σ",
    decision_note: "D",
    open_question_note: "!",
    hypothesis_note: "H",
    verification: "✓",
  };

  // Register cola if the CDN script exposed it as a plugin function.
  // Newer builds self-register against window.cytoscape; older builds
  // need an explicit use()-call. Guard both paths.
  let colaAvailable = false;
  try {
    if (typeof window.cytoscapeCola === "function" && typeof cytoscape.use === "function") {
      cytoscape.use(window.cytoscapeCola);
    }
    colaAvailable = !!(cytoscape.layout || typeof window.cytoscapeCola === "function");
  } catch (err) {
    console.warn("cola registration failed; falling back to cose", err);
  }

  const cy = cytoscape({
    container: document.getElementById("graph"),
    boxSelectionEnabled: false,
    wheelSensitivity: 0.2,
    style: [
      {
        selector: "node",
        style: {
          "background-color": ele => NODE_COLORS[ele.data("styleKey")] || "#8892a6",
          "shape": ele => NODE_SHAPES[ele.data("styleKey")] || "ellipse",
          "label": ele => NODE_GLYPHS[ele.data("styleKey")] || "·",
          "font-size": 9,
          "font-family": "ui-sans-serif, system-ui, sans-serif",
          "font-weight": 600,
          "color": "#0f1115",
          "text-opacity": 0.85,
          "text-valign": "center",
          "text-halign": "center",
          "width": 22,
          "height": 22,
          "border-width": 0.5,
          "border-color": "#0f1115",
        },
      },
      {
        selector: "node.titled",
        style: {
          "font-size": 8,
          "color": "#e3e7ef",
          "text-opacity": 1,
          "text-valign": "bottom",
          "text-halign": "center",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 130,
          "label": "data(title)",
          "z-index": 20,
        },
      },
      {
        selector: "node:selected, node.hover",
        style: {
          "border-width": 2,
          "border-color": "#fff",
          "z-index": 10,
        },
      },
      {
        selector: "edge",
        style: {
          "width": 0.8,
          "line-color": "#2a2f3c",
          "target-arrow-color": "#2a2f3c",
          "target-arrow-shape": "triangle",
          "arrow-scale": 0.6,
          "curve-style": "bezier",
          "label": "",
          "font-size": 4,
          "color": "#8892a6",
          "text-rotation": "autorotate",
          "text-opacity": 0,
        },
      },
      {
        selector: "edge.hover, edge:selected",
        style: {
          "line-color": "#6aa9ff",
          "target-arrow-color": "#6aa9ff",
          "width": 1.5,
          "label": "data(label)",
          "font-size": 6,
          "text-opacity": 1,
        },
      },
      { selector: ".new", style: { "border-color": "#fff", "border-width": 2 } },
    ],
    layout: { name: "preset" },
  });

  cy.on("mouseover", "node", e => e.target.addClass("hover"));
  cy.on("mouseout", "node", e => e.target.removeClass("hover"));
  cy.on("mouseover", "edge", e => e.target.addClass("hover"));
  cy.on("mouseout", "edge", e => e.target.removeClass("hover"));

  // Continuous spring-physics layout. Re-kicked whenever a new node lands so
  // the existing nodes ripple and make room for it. If cola isn't available
  // at runtime, fall back to cose (one-shot, animated) so nodes still render.
  let colaLayout = null;
  function startLayout() {
    if (cy.elements().length === 0) return;
    if (colaLayout) { try { colaLayout.stop(); } catch {} }
    const opts = colaAvailable
      ? {
          name: "cola",
          animate: true,
          infinite: true,
          fit: false,
          nodeSpacing: 18,
          edgeLength: 90,
          randomize: false,
          maxSimulationTime: 3000,
          unconstrIter: 8,
          userConstIter: 0,
          allConstIter: 8,
        }
      : { name: "cose", animate: true, animationDuration: 400, fit: false };
    try {
      colaLayout = cy.layout(opts);
      colaLayout.run();
    } catch (err) {
      console.warn("layout failed, retrying with cose", err);
      colaAvailable = false;
      colaLayout = cy.layout({ name: "cose", animate: false, fit: false });
      colaLayout.run();
    }
  }

  let currentRunId = null;
  let ws = null;
  const notesById = {};

  // Reconnect state: tracks exponential-backoff retries after an unexpected
  // WebSocket close (laptop sleep, transient network hiccup). Reset on a
  // successful onopen, on manual run switch, and on terminal status.
  let reconnectAttempts = 0;
  let reconnectTimer = null;
  let runIsTerminal = false;
  const RECONNECT_MAX_ATTEMPTS = 10;
  const RUN_ID_STORAGE_KEY = "dra:currentRunId";
  const runsSelectEl = document.getElementById("runs-select");

  // Initial debug readout so we can see layout engine + graph state before
  // any events arrive.
  updateDebug();

  cy.on("tap", "node", evt => {
    const node = evt.target;
    // Toggle the title label on the clicked node; load details panel too.
    const wasTitled = node.hasClass("titled");
    cy.nodes().removeClass("titled");
    if (!wasTitled) node.addClass("titled");
    loadNoteDetails(node.id());
  });

  cy.on("tap", evt => {
    // Click on empty canvas clears pinned titles.
    if (evt.target === cy) cy.nodes().removeClass("titled");
  });

  function setStatus(text, cls = "") {
    statusEl.textContent = text;
    statusEl.className = cls;
  }

  function timestamp(iso) {
    try { return new Date(iso).toLocaleTimeString(); } catch { return ""; }
  }

  function logRow(kind, text, iso) {
    const row = document.createElement("div");
    row.className = `log-row ${kind.replace(/_/g, "-")}`;
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = timestamp(iso);
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = {
      task_started: "▶",
      task_done: "✓",
      note_created: "+",
      note_replaced: "~",
      tool_call_start: "→",
      tool_call_end: "✓",
      run_started: "…",
      run_done: "✓",
      run_failed: "✗",
    }[kind] || "·";
    row.append(t, tag, document.createTextNode(text));
    activityEl.append(row);
    activityEl.scrollTop = activityEl.scrollHeight;
  }

  function truncate(s, n) {
    if (!s) return "";
    return s.length > n ? s.slice(0, n - 1) + "…" : s;
  }

  function addOrUpdateNode(data) {
    try {
      const payload = {
        ...data,
        id: data.id,
        title: truncate(data.title || data.id, 40),
        styleKey: nodeKey(data),
      };
      const existing = cy.getElementById(data.id);
      if (existing.nonempty()) {
        existing.data(payload);
      } else {
        cy.add({ data: payload });
        cy.getElementById(data.id).addClass("new");
        setTimeout(() => cy.getElementById(data.id).removeClass("new"), 1500);
      }
      for (const link of data.links || []) {
        const targetExists = cy.getElementById(link.target_id).nonempty();
        if (!targetExists) continue;
        const edgeId = `${data.id}->${link.target_id}:${link.edge_type}`;
        if (cy.getElementById(edgeId).empty()) {
          cy.add({
            data: {
              id: edgeId,
              source: data.id,
              target: link.target_id,
              label: link.edge_type,
            },
          });
        }
      }
      relayout();
      updateDebug();
    } catch (err) {
      console.error("addOrUpdateNode failed", err, data);
      debugEl.classList.add("err");
      updateDebug("ERR:" + (err && err.message ? err.message.slice(0, 40) : "unknown"));
    }
  }

  // Cola runs continuously; when nodes land we re-kick it (debounced) so it
  // reindexes and the springs settle. First few adds also auto-fit the viewport.
  let relayoutPending = null;
  let addsSinceFit = 0;
  function relayout() {
    if (relayoutPending) clearTimeout(relayoutPending);
    relayoutPending = setTimeout(() => {
      startLayout();
      addsSinceFit += 1;
      if (addsSinceFit <= 6) {
        setTimeout(() => cy.fit(undefined, 40), 300);
      }
    }, 100);
  }

  async function loadNoteDetails(noteId) {
    if (!currentRunId) return;
    detailsEl.innerHTML = `<div class="placeholder">Loading ${noteId}…</div>`;
    try {
      const res = await fetch(`/api/note/${currentRunId}/${noteId}`);
      if (!res.ok) throw new Error(`${res.status}`);
      const note = await res.json();
      renderNote(note);
    } catch (err) {
      detailsEl.innerHTML = `<div class="placeholder">Failed to load: ${err}</div>`;
    }
  }

  function renderNote(note) {
    const meta = JSON.stringify(note.metadata, null, 2);
    const body = note.content ? marked.parse(note.content) : "<em>(no content)</em>";
    detailsEl.innerHTML = `
      <h3>${escape(note.title)}</h3>
      <div class="subtitle">${note.type} · v${note.version} · ${note.id}</div>
      <div class="meta">${escape(meta)}</div>
      <div class="body">${body}</div>
    `;
  }

  function escape(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;",
    })[c]);
  }

  async function loadReport(noteId) {
    if (!currentRunId) return;
    reportContent.innerHTML = `<div class="report-empty">Loading report…</div>`;
    try {
      const res = await fetch(`/api/note/${currentRunId}/${noteId}`);
      if (!res.ok) throw new Error(`${res.status}`);
      const note = await res.json();
      renderReport(note);
    } catch (err) {
      reportContent.innerHTML = `<div class="report-empty">Failed to load: ${escape(String(err))}</div>`;
    }
  }

  function renderReport(note) {
    const body = note.content ? marked.parse(note.content) : "<em>(no content)</em>";
    const meta = JSON.stringify(note.metadata || {}, null, 2);
    reportContent.innerHTML = `
      <div class="report-head">
        <h1>${escape(note.title || "Report")}</h1>
        <div class="sub">${escape(note.type || "")} · v${note.version ?? 1} · ${escape(note.id || "")}</div>
      </div>
      <details class="report-meta"><summary>metadata</summary>${escape(meta)}</details>
      <div class="report-body">${body}</div>
    `;
  }

  // --- Running agents panel ----------------------------------------------
  // Live view of dispatched-but-not-done tasks. Each task_started event
  // inserts a card; each task_done event flashes its card (green for
  // DONE, red for ABANDONED) then fades + removes after 500ms. The
  // right-side tasks panel still records full history via upsertTask.
  const runningAgents = new Map(); // task_id -> { data, el, startedAtMs }
  const runningAgentsEl = document.getElementById("running-agents");
  const runningAgentsTitleEl = document.getElementById("running-agents-title");

  function shortModel(modelId) {
    if (!modelId) return "";
    // Strip the family prefix ("anthropic/claude-opus-4-7" -> "claude-opus-4-7")
    // so the card label stays compact.
    const slash = modelId.indexOf("/");
    return slash >= 0 ? modelId.slice(slash + 1) : modelId;
  }

  function fmtElapsed(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const mm = String(Math.floor(s / 60)).padStart(2, "0");
    const ss = String(s % 60).padStart(2, "0");
    return `${mm}:${ss}`;
  }

  function updateRunningAgentsTitle() {
    runningAgentsTitleEl.textContent = `Agents Running (${runningAgents.size})`;
  }

  function addAgentCard(data) {
    // Clear the empty placeholder on first card.
    if (runningAgents.size === 0) runningAgentsEl.innerHTML = "";

    const card = document.createElement("div");
    card.className = `agent-card tier-${data.tier || "MID"}`;
    card.dataset.taskId = data.id;

    const head = document.createElement("div");
    head.className = "head";
    const dot = document.createElement("span");
    dot.className = "dot";
    const type = document.createElement("span");
    type.className = "type";
    type.textContent = data.type || "?";
    const sep1 = document.createElement("span"); sep1.className = "sep"; sep1.textContent = "·";
    const pill = document.createElement("span");
    pill.className = "tier-pill";
    pill.textContent = data.tier || "";
    const sep2 = document.createElement("span"); sep2.className = "sep"; sep2.textContent = "·";
    const model = document.createElement("span");
    model.className = "model";
    model.textContent = shortModel(data.model_id);
    head.append(dot, type, sep1, pill, sep2, model);

    const goal = document.createElement("div");
    goal.className = "goal";
    goal.textContent = data.goal || "";

    const foot = document.createElement("div");
    foot.className = "foot";
    const io = document.createElement("span");
    io.className = "io";
    io.innerHTML = `reads <b>${(data.reads_notes || []).length}</b> · writes <b>${(data.writes_notes || []).length}</b>`;
    const elapsed = document.createElement("span");
    elapsed.className = "elapsed";
    elapsed.textContent = "00:00";
    foot.append(io, elapsed);

    const toolActivity = document.createElement("div");
    toolActivity.className = "tool-activity";

    const body = document.createElement("div");
    body.className = "expanded-body";

    card.append(head, goal, foot, toolActivity, body);

    card.addEventListener("click", () => toggleAgentExpanded(data.id));
    runningAgentsEl.prepend(card); // newest on top

    const startedAtMs =
      data.started_at ? new Date(data.started_at).getTime() : Date.now();
    runningAgents.set(data.id, {
      data,
      el: card,
      elapsedEl: elapsed,
      toolActivityEl: toolActivity,
      toolRows: new Map(), // tool_call_id -> row element
      startedAtMs,
    });
    updateRunningAgentsTitle();
  }

  function onToolCallStart(data) {
    const entry = runningAgents.get(data.agent_id);
    if (!entry) return; // parent agent already faded; ignore
    const row = document.createElement("div");
    row.className = "tool-row pending";
    row.dataset.toolCallId = data.tool_call_id;
    const dot = document.createElement("span");
    dot.className = "dot-tc";
    const name = document.createElement("span");
    name.className = "tc-name";
    name.textContent = data.tool;
    const summary = document.createElement("span");
    summary.className = "tc-summary";
    summary.textContent = data.summary || "";
    const ms = document.createElement("span");
    ms.className = "tc-ms";
    ms.textContent = "...";
    row.append(dot, name, summary, ms);
    // column-reverse means DOM order is oldest-last; append to keep that.
    entry.toolActivityEl.append(row);
    entry.toolRows.set(data.tool_call_id, row);
    // Cap rows so a long-running agent's activity doesn't grow unbounded.
    while (entry.toolActivityEl.children.length > 30) {
      const stale = entry.toolActivityEl.firstChild;
      entry.toolActivityEl.removeChild(stale);
    }
  }

  function onToolCallEnd(data) {
    const entry = runningAgents.get(data.agent_id);
    if (!entry) return;
    const row = entry.toolRows.get(data.tool_call_id);
    if (!row) return;
    row.classList.remove("pending");
    row.classList.add(data.status === "ok" ? "ok" : "error");
    const summaryEl = row.querySelector(".tc-summary");
    if (summaryEl && data.summary) {
      summaryEl.textContent = `${summaryEl.textContent} → ${data.summary}`;
    }
    const msEl = row.querySelector(".tc-ms");
    if (msEl) msEl.textContent = `${data.duration_ms}ms`;
  }

  function finishAgentCard(taskId, status) {
    const entry = runningAgents.get(taskId);
    if (!entry) return;
    entry.el.classList.remove("tier-LOW", "tier-MID", "tier-HIGH");
    entry.el.classList.add(status === "ABANDONED" ? "abandoned" : "done");
    // Short flash, then fade + remove. Keeps the momentary state visible
    // so the user registers that the task completed rather than just
    // vanishing.
    setTimeout(() => {
      entry.el.classList.add("fading");
      setTimeout(() => {
        entry.el.remove();
        runningAgents.delete(taskId);
        if (runningAgents.size === 0) {
          runningAgentsEl.innerHTML = `<div class="empty">No agents running.</div>`;
        }
        updateRunningAgentsTitle();
      }, 450);
    }, 400);
  }

  function toggleAgentExpanded(taskId) {
    const entry = runningAgents.get(taskId);
    if (!entry) return;
    const body = entry.el.querySelector(".expanded-body");
    const nowExpanded = !entry.el.classList.contains("expanded");
    entry.el.classList.toggle("expanded", nowExpanded);
    if (!nowExpanded) return;
    // Render expanded content lazily on first open.
    const d = entry.data;
    const parts = [];
    if (d.pattern) {
      parts.push(`<div class="kv"><span class="k">pattern</span>${d.pattern}</div>`);
    }
    if (d.role) {
      parts.push(`<div class="kv"><span class="k">role</span>${d.role}</div>`);
    }
    if (d.model_id) {
      parts.push(`<div class="kv"><span class="k">model</span>${d.model_id}</div>`);
    }
    if ((d.reads_notes || []).length) {
      parts.push(`<div class="label">reads</div>`);
      for (const nid of d.reads_notes) {
        const note = notesById[nid];
        const label = note ? `${note.type} · ${truncate(note.title, 50)}` : nid;
        parts.push(`<div class="note-link" data-note-id="${nid}">${label}</div>`);
      }
    }
    if ((d.writes_notes || []).length) {
      parts.push(`<div class="label">writes</div>`);
      for (const nid of d.writes_notes) {
        const note = notesById[nid];
        const label = note ? `${note.type} · ${truncate(note.title, 50)}` : nid;
        parts.push(`<div class="note-link" data-note-id="${nid}">${label}</div>`);
      }
    }
    body.innerHTML = parts.join("");
    // Wire up note-click handlers to re-use the existing details loader.
    for (const link of body.querySelectorAll(".note-link")) {
      link.addEventListener("click", ev => {
        ev.stopPropagation();
        const nid = link.dataset.noteId;
        if (nid && typeof loadNoteDetails === "function") loadNoteDetails(nid);
      });
    }
  }

  // One shared tick for all cards. Cheap: ~10 cards max, one textContent
  // update per tick. No-op when no cards exist.
  setInterval(() => {
    const now = Date.now();
    for (const entry of runningAgents.values()) {
      entry.elapsedEl.textContent = fmtElapsed(now - entry.startedAtMs);
    }
  }, 1000);

  function clearRunningAgents() {
    runningAgents.clear();
    runningAgentsEl.innerHTML = `<div class="empty">No agents running.</div>`;
    updateRunningAgentsTitle();
  }

  // --- Task panel ---------------------------------------------------------
  const tasks = new Map(); // id -> {id, type, goal, status, verdict}

  function upsertTask({ id, type, goal, status, verdict }) {
    const existing = tasks.get(id) || {};
    const merged = {
      id,
      type: type || existing.type,
      goal: goal !== null && goal !== undefined ? goal : existing.goal,
      status: status || existing.status || "running",
      verdict: verdict !== undefined ? verdict : existing.verdict,
    };
    tasks.set(id, merged);
    renderTasks();
  }

  function renderTasks() {
    tasksEl.innerHTML = "";
    if (tasks.size === 0) {
      tasksEl.innerHTML = `<div class="placeholder" style="padding:12px;color:var(--muted);font-style:italic;">No tasks yet.</div>`;
      return;
    }
    for (const t of tasks.values()) {
      const row = document.createElement("div");
      row.className = `task-row ${t.status}`;
      row.title = t.goal || "";
      const dot = document.createElement("span");
      dot.className = "dot";
      const main = document.createElement("span");
      main.className = "main";
      const type = document.createElement("span");
      type.className = "type";
      type.textContent = t.type || "?";
      const goal = document.createElement("span");
      goal.className = "goal";
      goal.textContent = truncate(t.goal || "", 80);
      main.append(type, goal);
      const verdict = document.createElement("span");
      verdict.className = "verdict";
      verdict.textContent = t.verdict ? truncate(t.verdict, 40) : "";
      row.append(dot, main, verdict);
      tasksEl.append(row);
    }
  }

  // --- Draggable resizers -------------------------------------------------
  function initResizers() {
    for (const r of document.querySelectorAll(".resizer-v, .resizer-h")) {
      const isRow = r.classList.contains("resizer-h");
      r.addEventListener("mousedown", e => {
        e.preventDefault();
        r.classList.add("dragging");
        document.body.classList.add(isRow ? "resizing-row" : "resizing");
        const onMove = ev => {
          if (isRow) {
            const top = document.querySelector(r.dataset.top);
            const bottom = document.querySelector(r.dataset.bottom);
            if (!top || !bottom) return;
            const topRect = top.getBoundingClientRect();
            const bottomRect = bottom.getBoundingClientRect();
            const totalH = topRect.height + bottomRect.height;
            const newTopH = Math.max(60, Math.min(totalH - 60, ev.clientY - topRect.top));
            const frac = newTopH / totalH;
            top.style.flex = `${frac} 1 0`;
            bottom.style.flex = `${1 - frac} 1 0`;
          } else {
            // Column resize. Two cases: dragging the resizer between
            // the left aside and the graph (grow/shrink #left-aside),
            // or the resizer between the graph and the right aside.
            const side = r.dataset.side || "right";
            const target = document.getElementById(
              side === "left" ? "left-aside" : "right-aside"
            );
            if (!target) return;
            // Both sides share a "leave at least 200px for the graph"
            // constraint so dragging to extremes doesn't hide it.
            const maxWidth = Math.max(240, window.innerWidth - 200);
            const newWidth =
              side === "left"
                ? Math.max(200, Math.min(maxWidth, ev.clientX))
                : Math.max(200, Math.min(maxWidth, window.innerWidth - ev.clientX));
            target.style.width = `${newWidth}px`;
          }
          cy.resize();
        };
        const onUp = () => {
          r.classList.remove("dragging");
          document.body.classList.remove("resizing", "resizing-row");
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
          cy.resize();
          startLayout();
        };
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
      });
    }
  }
  initResizers();

  function handleEvent(evt) {
    const { kind, at, data } = evt;
    switch (kind) {
      case "run_started":
        logRow(kind, `run ${data.run_id} started — ${data.query}`, at);
        break;
      case "task_started":
        logRow(kind, `${data.type} — ${truncate(data.goal, 80)}`, at);
        upsertTask({ id: data.id, type: data.type, goal: data.goal, status: "running" });
        addAgentCard(data);
        break;
      case "task_done":
        logRow(kind, `${data.type} — ${truncate(data.verdict, 120)}`, at);
        upsertTask({
          id: data.id, type: data.type, goal: null,
          status: data.status === "ABANDONED" ? "abandoned" : "done",
          verdict: data.verdict,
        });
        finishAgentCard(data.id, data.status);
        break;
      case "note_created":
        logRow(kind, `${data.type} · ${truncate(data.title, 60)}`, at);
        addOrUpdateNode(data);
        break;
      case "note_replaced":
        logRow(kind, `${data.type} · ${truncate(data.title, 60)} (v${data.version})`, at);
        addOrUpdateNode(data);
        break;
      case "tool_call_start":
        onToolCallStart(data);
        break;
      case "tool_call_end":
        onToolCallEnd(data);
        break;
      case "token_usage":
        onTokenUsage(data);
        break;
      case "run_done":
        logRow(kind, `run complete${data.report_note_id ? ` — report ${data.report_note_id}` : ""}`, at);
        setStatus("done", "ok");
        goBtn.disabled = false;
        runIsTerminal = true;
        refreshRunsDropdown(currentRunId);
        if (data.report_note_id) {
          lastReportNoteId = data.report_note_id;
          tabReport.hidden = false;
          tabReport.classList.add("has-report");
          // Re-trigger flash so the tab draws the eye even if it was
          // already unhidden from a prior run.
          tabReport.classList.remove("flash");
          void tabReport.offsetWidth;
          tabReport.classList.add("flash");
          loadReport(data.report_note_id);
          switchView("report");
        }
        break;
      case "run_failed":
        logRow(kind, `FAILED — ${data.error}`, at);
        setStatus("failed", "err");
        goBtn.disabled = false;
        runIsTerminal = true;
        refreshRunsDropdown(currentRunId);
        break;
    }
  }

  async function startRun() {
    const query = queryInput.value.trim();
    if (!query) return;
    if (ws) { try { ws.close(); } catch {} }
    activityEl.innerHTML = "";
    detailsEl.innerHTML = `<div class="placeholder">Running…</div>`;
    tasks.clear();
    tasksEl.innerHTML = "";
    clearRunningAgents();
    cy.elements().remove();
    resetTokens();
    lastReportNoteId = null;
    tabReport.hidden = true;
    tabReport.classList.remove("has-report", "flash");
    reportContent.innerHTML = `<div class="report-empty">No report yet — start a run.</div>`;
    switchView("live");
    goBtn.disabled = true;
    setStatus("starting…");
    let res;
    try {
      res = await fetch("/api/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });
    } catch (err) {
      setStatus("offline", "err");
      goBtn.disabled = false;
      return;
    }
    if (!res.ok) {
      setStatus(`error ${res.status}`, "err");
      goBtn.disabled = false;
      return;
    }
    const { run_id } = await res.json();
    currentRunId = run_id;
    runIsTerminal = false;
    reconnectAttempts = 0;
    saveRunId(run_id);
    refreshRunsDropdown(run_id);
    connect(run_id);
  }

  function connect(runId) {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/api/ws/${runId}`);
    ws.onopen = () => {
      reconnectAttempts = 0;
      setStatus("running");
    };
    ws.onmessage = e => {
      eventCount++;
      updateDebug();
      try { handleEvent(JSON.parse(e.data)); }
      catch (err) { console.error("bad event", e.data, err); }
    };
    ws.onerror = () => { /* onclose always fires after; handle reconnect there */ };
    ws.onclose = () => {
      // Don't reconnect for runs that finished cleanly.
      if (runIsTerminal) {
        if (statusEl.textContent === "running") setStatus("disconnected", "err");
        return;
      }
      if (reconnectAttempts >= RECONNECT_MAX_ATTEMPTS) {
        setStatus("disconnected (gave up)", "err");
        return;
      }
      const delayMs = Math.min(1000 * Math.pow(2, reconnectAttempts), 16000);
      reconnectAttempts++;
      setStatus(`reconnecting in ${Math.round(delayMs / 1000)}s (${reconnectAttempts}/${RECONNECT_MAX_ATTEMPTS})`, "err");
      reconnectTimer = setTimeout(() => {
        if (currentRunId) connect(currentRunId);
      }, delayMs);
    };
  }

  // --- Run persistence + past-runs dropdown ---------------------------------

  function saveRunId(runId) {
    try { localStorage.setItem(RUN_ID_STORAGE_KEY, runId); } catch {}
  }

  function clearSavedRunId() {
    try { localStorage.removeItem(RUN_ID_STORAGE_KEY); } catch {}
  }

  function loadSavedRunId() {
    try { return localStorage.getItem(RUN_ID_STORAGE_KEY); } catch { return null; }
  }

  // Clear UI state in the same way startRun does, so a replayed history from
  // the server doesn't pile on top of existing render state.
  function resetUiForRun() {
    activityEl.innerHTML = "";
    detailsEl.innerHTML = `<div class="placeholder">Running…</div>`;
    tasks.clear();
    tasksEl.innerHTML = "";
    clearRunningAgents();
    cy.elements().remove();
    resetTokens();
    lastReportNoteId = null;
    tabReport.hidden = true;
    tabReport.classList.remove("has-report", "flash");
    reportContent.innerHTML = `<div class="report-empty">No report yet — start a run.</div>`;
    switchView("live");
    eventCount = 0;
    updateDebug();
  }

  function reconnectToRun(runId) {
    if (!runId) return;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (ws) { try { ws.close(); } catch {} }
    reconnectAttempts = 0;
    runIsTerminal = false;
    currentRunId = runId;
    saveRunId(runId);
    resetUiForRun();
    setStatus("reconnecting…");
    connect(runId);
  }

  async function refreshRunsDropdown(selectedRunId = null) {
    let runs = [];
    try {
      const res = await fetch("/api/runs");
      if (res.ok) runs = (await res.json()).runs || [];
    } catch { return; }
    // Newest first.
    runs.sort((a, b) => (b.started_at || "").localeCompare(a.started_at || ""));
    const optionFor = r => {
      const q = (r.query || "").slice(0, 40) || "(no query)";
      const t = r.started_at ? new Date(r.started_at).toLocaleTimeString() : "";
      const done = r.finished ? "✓" : "·";
      return `<option value="${r.run_id}">${done} ${q} — ${t}</option>`;
    };
    runsSelectEl.innerHTML =
      `<option value="">past runs…</option>` + runs.map(optionFor).join("");
    const wanted = selectedRunId || currentRunId;
    if (wanted && runs.some(r => r.run_id === wanted)) {
      runsSelectEl.value = wanted;
    }
  }

  runsSelectEl.addEventListener("change", () => {
    const runId = runsSelectEl.value;
    if (runId && runId !== currentRunId) reconnectToRun(runId);
  });

  // On page load: populate the dropdown, then try to reconnect to whatever
  // run the user was last on (if the server still has it in its registry).
  (async () => {
    await refreshRunsDropdown();
    const saved = loadSavedRunId();
    if (!saved) return;
    // Only auto-reconnect if the server still knows about this run.
    const known = Array.from(runsSelectEl.options).some(o => o.value === saved);
    if (known) {
      reconnectToRun(saved);
    } else {
      // Server has forgotten it (restart) - drop the stale pointer.
      clearSavedRunId();
    }
  })();

  goBtn.addEventListener("click", startRun);
  queryInput.addEventListener("keydown", e => {
    if (e.key === "Enter") startRun();
  });
})();
</script>
</body>
</html>
