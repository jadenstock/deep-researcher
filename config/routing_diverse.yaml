# Larger-model diverse-family routing (ADR 0008 target policy). Not the
# default; routing_lean.yaml is. Pass --routing config/routing_diverse.yaml.
#
# Generative tasks run on the Claude family. Judgment tasks run on the OpenAI
# family. Cheap deterministic tasks (tier classification, scanner, termination
# audit — no LLM for the audit itself) run on Haiku.
#
# The hard cross-family invariant is enforced by the executor: for any
# VERIFY_CLAIM, the model family must differ from the model family that ran
# the ANALYZE_SOURCE that produced the claim being verified. The invariant is
# structural, not a prompt discipline.

name: diverse_default
description: |
  Production-target routing. Claude family for generative roles, GPT family
  for judgment roles, Haiku for cheap deterministic roles. Satisfies the
  ADR 0008 cross-family invariant by construction.

# Model IDs use "family/model" form (LiteLLM convention).
# The full string is sent to the router as the model name.
tiers:
  LOW:
    generative: anthropic/claude-haiku-5-5
    judgment: openai/gpt-6-luna
    cheap_deterministic: anthropic/claude-haiku-5-5
  MID:
    generative: anthropic/claude-sonnet-5-5
    judgment: openai/gpt-6.1-sol
    cheap_deterministic: anthropic/claude-haiku-5-5
  HIGH:
    generative: anthropic/claude-opus-5-5
    judgment: openai/gpt-6-astra
    cheap_deterministic: anthropic/claude-haiku-5-5
